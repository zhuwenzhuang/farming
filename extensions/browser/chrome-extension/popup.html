<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Farming Browser Connector</title>
    <style>
      :root {
        color-scheme: light dark;
        font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #24292f;
        background: #ffffff;
      }
      body {
        width: 272px;
        margin: 0;
        padding: 16px;
      }
      h1 {
        margin: 0 0 14px;
        font-size: 15px;
        font-weight: 600;
      }
      .status-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .dot {
        width: 7px;
        height: 7px;
        flex: 0 0 auto;
        border-radius: 50%;
        background: #8c959f;
      }
      .dot.connected {
        background: #1a7f37;
      }
      .dot.error {
        background: #cf222e;
      }
      #status {
        margin: 0;
        font-weight: 500;
      }
      #detail,
      #error {
        margin: 5px 0 0 15px;
        color: #57606a;
      }
      #error {
        color: #cf222e;
      }
      .actions {
        display: flex;
        margin-top: 14px;
      }
      button {
        min-height: 30px;
        padding: 5px 11px;
        border: 1px solid #d0d7de;
        border-radius: 6px;
        background: #f6f8fa;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      button:hover {
        background: #eef1f4;
      }
      #disconnect {
        color: #cf222e;
      }
      .hidden {
        display: none;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color: #e6edf3;
          background: #0d1117;
        }
        #detail {
          color: #8b949e;
        }
        #error,
        #disconnect {
          color: #ff7b72;
        }
        button {
          border-color: #30363d;
          background: #21262d;
        }
        button:hover {
          background: #30363d;
        }
      }
    </style>
  </head>
  <body>
    <h1>Farming Browser Connector</h1>
    <main>
      <div class="status-row">
        <span id="indicator" class="dot" aria-hidden="true"></span>
        <p id="status">Connecting…</p>
      </div>
      <p id="detail">Checking Farming connection.</p>
      <p id="error" class="hidden"></p>
      <div class="actions">
        <button id="connect" class="hidden" type="button">Connect</button>
        <button id="disconnect" class="hidden" type="button">Disconnect</button>
      </div>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
