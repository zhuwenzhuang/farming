name: Browser native transfer probe

on:
  workflow_dispatch:
    inputs:
      preparation_run_id:
        description: 'Successful release preparation that produced the native Browser artifacts'
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  probe:
    name: Native transfer ${{ matrix.arch }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    env:
      GH_TOKEN: ${{ github.token }}
      ORIGIN_RUN_ID: ${{ inputs.preparation_run_id }}
      FARMING_BASE_PATH: /farming
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Read immutable origin preparation
        shell: bash
        run: |
          [[ "${ORIGIN_RUN_ID}" =~ ^[0-9]+$ ]]
          node scripts/observe-release-gh.mjs api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${ORIGIN_RUN_ID}" > "${RUNNER_TEMP}/farming-browser-transfer-origin.json"
      - name: Download native Browser artifact
        uses: actions/download-artifact@v4
        with:
          name: farming-agent-browser-darwin-${{ matrix.arch }}
          path: ${{ runner.temp }}/farming-browser-transfer-input
          github-token: ${{ github.token }}
          run-id: ${{ inputs.preparation_run_id }}
      - name: Assemble trusted native component for exact candidate
        run: >-
          node scripts/reuse-agent-browser-runtime.mjs emit "darwin-${{ matrix.arch }}"
          "${{ runner.temp }}/farming-browser-transfer-input"
          "${{ runner.temp }}/farming-browser-transfer-origin.json"
          "${{ runner.temp }}/farming-browser-transfer-candidate"
      - name: Restore and verify native Browser through product transfer path
        run: >-
          node scripts/transfer-native-browser-runtime.mjs "darwin-${{ matrix.arch }}"
          "${{ runner.temp }}/farming-browser-transfer-candidate"
          "${{ runner.temp }}/farming-browser-transfer-packaged"
      - name: Install smoke harness dependencies
        run: |
          FARMING_SKIP_INSTALL_RUNTIME_PREPARE=1 PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 PUPPETEER_SKIP_DOWNLOAD=1 \
            npm ci --registry=https://registry.npmjs.org/ --no-audit --no-fund
      - name: Smoke transferred native Browser with real Chrome
        shell: bash
        run: |
          npx tsx scripts/smoke-browser-idle.ts \
            "${RUNNER_TEMP}/farming-browser-transfer-packaged/darwin-${{ matrix.arch }}/agent-browser" \
            '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome'
      - name: Build diagnostic native App
        env:
          FARMING_AGENT_BROWSER_ARTIFACTS: ${{ runner.temp }}/farming-browser-transfer-packaged
          FARMING_RELEASE_PLATFORM: darwin
          FARMING_RELEASE_ARCH: ${{ matrix.arch }}
          FARMING_RELEASE_STAGE_ROOT: ${{ runner.temp }}/farming-browser-transfer-app
          FARMING_BASE_PATH: /farming
        run: npm run release:app
      - name: Verify and smoke complete native App
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          node --import tsx scripts/verify-release-bundle.ts "releases/${version}/farming-${version}-darwin-${{ matrix.arch }}.tar.gz"
          npm run release:cli:smoke -- "${RUNNER_TEMP}/farming-browser-transfer-app/farming-${version}-darwin-${{ matrix.arch }}/farming"
          npx tsx scripts/smoke-browser-idle.ts \
            "${RUNNER_TEMP}/farming-browser-transfer-app/farming-${version}-darwin-${{ matrix.arch }}/dist/runtime/agent-browser/darwin-${{ matrix.arch }}/agent-browser" \
            '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome'
      - name: Retain verified candidate component identity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: farming-browser-transfer-${{ matrix.arch }}
          path: ${{ runner.temp }}/farming-browser-transfer-packaged/darwin-${{ matrix.arch }}/identity.json
          if-no-files-found: warn
      - name: Remove owned probe files
        if: always()
        shell: bash
        run: |
          rm -rf -- "${RUNNER_TEMP}/farming-browser-transfer-input"
          rm -rf -- "${RUNNER_TEMP}/farming-browser-transfer-packaged"
          rm -rf -- "${RUNNER_TEMP}/farming-browser-transfer-candidate"
          rm -rf -- "${RUNNER_TEMP}/farming-browser-transfer-app"
          rm -f -- "${RUNNER_TEMP}/farming-browser-transfer-signed"
          rm -f -- "${RUNNER_TEMP}/farming-browser-transfer-origin.json"
