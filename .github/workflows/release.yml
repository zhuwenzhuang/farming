name: Release Preparation

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Package version to publish (for example, 2.2.33)'
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    name: Validate release candidate
    runs-on: ubuntu-latest
    outputs:
      browser_origin_run_id: ${{ steps.browser-origin.outputs.run_id }}
    env:
      FARMING_RELEASE_VERSION: ${{ inputs.release_version }}
      FARMING_RELEASE_INTEGRATION_REF: refs/remotes/origin/main
    steps:
      - name: Require a branch dispatch
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" != "branch" ]]; then
            echo "Release candidates must be dispatched from a branch, not an existing tag." >&2
            exit 1
          fi

      - name: Normalize release version
        id: version
        shell: bash
        run: |
          version="${FARMING_RELEASE_VERSION}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "release_version must be an exact semver without a v prefix: ${version}" >&2
            exit 1
          fi
          echo "value=${version}" >> "${GITHUB_OUTPUT}"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify candidate is integrated into main
        run: scripts/verify-release-lineage.sh "${GITHUB_SHA}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org

      - name: Check managed Agent dependency updates
        run: npm run release:dependencies:check

      - name: Verify candidate versions and release notes
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          lock_version="$(node -p "require('./package-lock.json').packages[''].version")"
          notes_file="release-notes/v${RELEASE_VERSION}.md"
          if [[ "${RELEASE_VERSION}" != "${package_version}" || "${RELEASE_VERSION}" != "${lock_version}" ]]; then
            echo "release_version, package.json, and package-lock.json must match: requested=${RELEASE_VERSION}, package=${package_version}, lock=${lock_version}" >&2
            exit 1
          fi
          if [[ ! -f "${notes_file}" ]]; then
            echo "Missing release notes: ${notes_file}" >&2
            exit 1
          fi
          node scripts/verify-release-notes.mjs "${RELEASE_VERSION}"
          if npm view "farming-code@${RELEASE_VERSION}" version >/dev/null 2>&1; then
            candidate_sha="$(git rev-parse HEAD)"
            bash scripts/verify-npm-release-source.sh "farming-code@${RELEASE_VERSION}" "${candidate_sha}"
          fi

      - name: Select verified unchanged Browser components
        id: browser-origin
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/reuse-agent-browser-runtime.mjs select "${RUNNER_TEMP}/browser-origin.json"

      - name: Retain authenticated Browser origin
        if: steps.browser-origin.outputs.run_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: farming-browser-origin-${{ steps.version.outputs.value }}
          path: ${{ runner.temp }}/browser-origin.json
          if-no-files-found: error

  build-agent-browser:
    name: Build patched agent-browser ${{ matrix.platform }}
    needs: preflight
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            rustTarget: aarch64-unknown-linux-gnu
            zig: true
          - platform: linux-x64
            runner: ubuntu-24.04
            rustTarget: x86_64-unknown-linux-gnu
            zig: true
          - platform: linux-arm64-musl
            runner: ubuntu-24.04-arm
            rustTarget: aarch64-unknown-linux-musl
            zig: true
          - platform: linux-x64-musl
            runner: ubuntu-24.04
            rustTarget: x86_64-unknown-linux-musl
            zig: true
          - platform: win32-x64
            runner: windows-latest
            rustTarget: x86_64-pc-windows-msvc
            zig: false
    steps:
      - name: Preserve pinned source line endings
        shell: bash
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Rust
        if: needs.preflight.outputs.browser_origin_run_id == ''
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.96.1
          target: ${{ matrix.rustTarget }}
          rustflags: ''

      - name: Setup Python for Zig
        if: matrix.zig && needs.preflight.outputs.browser_origin_run_id == ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pinned Zig cross-build tools
        if: matrix.zig && needs.preflight.outputs.browser_origin_run_id == ''
        shell: bash
        run: |
          python -m pip install ziglang==0.15.2
          cargo install cargo-zigbuild --version 0.22.3 --locked

      - name: Cache patched browser Cargo intermediates
        if: needs.preflight.outputs.browser_origin_run_id == ''
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/farming-agent-browser-cargo-target
          key: agent-browser-cargo-v2-${{ runner.os }}-${{ runner.arch }}-rust-1.96.1-${{ matrix.platform }}-source-${{ hashFiles('backend/data/agent-browser-source.json', 'patches/agent-browser/*.patch', 'scripts/build-agent-browser-runtime.mjs') }}
          restore-keys: agent-browser-cargo-v2-${{ runner.os }}-${{ runner.arch }}-rust-1.96.1-${{ matrix.platform }}-source-

      - name: Build and verify patched agent-browser
        if: needs.preflight.outputs.browser_origin_run_id == ''
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/farming-agent-browser-cargo-target
        run: node scripts/build-agent-browser-runtime.mjs --platform "${{ matrix.platform }}" --output "$RUNNER_TEMP/agent-browser-artifacts"

      - name: Download authenticated Browser origin
        if: needs.preflight.outputs.browser_origin_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: farming-browser-origin-${{ inputs.release_version }}
          path: ${{ runner.temp }}/browser-origin

      - name: Download unchanged Browser component
        if: needs.preflight.outputs.browser_origin_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: farming-agent-browser-${{ matrix.platform }}
          path: ${{ runner.temp }}/browser-origin-artifacts
          github-token: ${{ github.token }}
          run-id: ${{ needs.preflight.outputs.browser_origin_run_id }}

      - name: Assemble verified Browser component for candidate
        if: needs.preflight.outputs.browser_origin_run_id != ''
        shell: bash
        run: |
          node scripts/reuse-agent-browser-runtime.mjs emit "${{ matrix.platform }}" \
            "$RUNNER_TEMP/browser-origin-artifacts" "$RUNNER_TEMP/browser-origin/browser-origin.json" \
            "$RUNNER_TEMP/agent-browser-artifacts"

      - name: Upload patched agent-browser runtime
        uses: actions/upload-artifact@v4
        with:
          name: farming-agent-browser-${{ matrix.platform }}
          path: ${{ runner.temp }}/agent-browser-artifacts
          if-no-files-found: error
          compression-level: 0

  build-macos-browser:
    name: Prepare native Browser darwin-${{ matrix.arch }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify native runner architecture
        shell: bash
        run: |
          case "${{ matrix.arch }}:$(uname -m)" in
            x64:x86_64|arm64:arm64) ;;
            *) echo "Runner architecture does not match Browser target" >&2; exit 1 ;;
          esac
      - name: Setup Rust for native macOS browser runtime
        if: needs.preflight.outputs.browser_origin_run_id == ''
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.96.1
          target: ${{ matrix.arch == 'arm64' && 'aarch64-apple-darwin' || 'x86_64-apple-darwin' }}
          rustflags: ''

      - name: Cache patched browser Cargo intermediates
        if: needs.preflight.outputs.browser_origin_run_id == ''
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/farming-agent-browser-cargo-target
          key: agent-browser-cargo-v2-${{ runner.os }}-${{ runner.arch }}-rust-1.96.1-darwin-${{ matrix.arch }}-source-${{ hashFiles('backend/data/agent-browser-source.json', 'patches/agent-browser/*.patch', 'scripts/build-agent-browser-runtime.mjs') }}
          restore-keys: |
            agent-browser-cargo-v2-${{ runner.os }}-${{ runner.arch }}-rust-1.96.1-darwin-${{ matrix.arch }}-source-
            agent-browser-cargo-v1-${{ runner.os }}-${{ runner.arch }}-rust-1.96.1-darwin-${{ matrix.arch }}-

      - name: Build native macOS browser runtime
        if: needs.preflight.outputs.browser_origin_run_id == ''
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/farming-agent-browser-cargo-target
        run: |
          native_artifacts="${RUNNER_TEMP}/native-agent-browser-artifacts"
          node scripts/build-agent-browser-runtime.mjs \
            --platform "darwin-${{ matrix.arch }}" \
            --output "${native_artifacts}"
          echo "FARMING_AGENT_BROWSER_ARTIFACTS=${native_artifacts}" >> "${GITHUB_ENV}"

      - name: Download authenticated Browser origin
        if: needs.preflight.outputs.browser_origin_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: farming-browser-origin-${{ inputs.release_version }}
          path: ${{ runner.temp }}/browser-origin

      - name: Download unchanged native Browser component
        if: needs.preflight.outputs.browser_origin_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: farming-agent-browser-darwin-${{ matrix.arch }}
          path: ${{ runner.temp }}/browser-origin-artifacts
          github-token: ${{ github.token }}
          run-id: ${{ needs.preflight.outputs.browser_origin_run_id }}

      - name: Assemble and sign native Browser component for candidate
        if: needs.preflight.outputs.browser_origin_run_id != ''
        shell: bash
        run: |
          native_artifacts="${RUNNER_TEMP}/native-agent-browser-artifacts"
          node scripts/reuse-agent-browser-runtime.mjs emit "darwin-${{ matrix.arch }}" \
            "$RUNNER_TEMP/browser-origin-artifacts" "$RUNNER_TEMP/browser-origin/browser-origin.json" \
            "${native_artifacts}"
          echo "FARMING_AGENT_BROWSER_ARTIFACTS=${native_artifacts}" >> "${GITHUB_ENV}"

      - name: Sign and verify native candidate Browser
        run: >-
          node scripts/transfer-native-browser-runtime.mjs
          "darwin-${{ matrix.arch }}"
          "${{ runner.temp }}/native-agent-browser-artifacts"
          "${{ runner.temp }}/signed-agent-browser-artifacts"
      - name: Upload verified native macOS browser runtime
        uses: actions/upload-artifact@v4
        with:
          name: farming-agent-browser-darwin-${{ matrix.arch }}
          path: ${{ runner.temp }}/signed-agent-browser-artifacts
          if-no-files-found: error
          compression-level: 0

  build-linux:
    name: Build Linux ${{ matrix.kind }} artifacts
    runs-on: ubuntu-latest
    needs: [preflight, build-agent-browser, build-macos-browser]
    strategy:
      fail-fast: false
      matrix:
        kind: [cli, app, legacy]
    env:
      FARMING_BASE_PATH: /farming
      FARMING_RELEASE_VERSION: ${{ inputs.release_version }}
      FARMING_RELEASE_INTEGRATION_REF: refs/remotes/origin/main
      FARMING_AGENT_BROWSER_ARTIFACTS: ${{ github.workspace }}/../release-agent-browser-artifacts
    steps:
      - name: Normalize release version
        id: version
        shell: bash
        run: |
          version="${FARMING_RELEASE_VERSION}"
          echo "value=${version}" >> "${GITHUB_OUTPUT}"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release version
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          lock_version="$(node -p "require('./package-lock.json').packages[''].version")"
          if [[ "${RELEASE_VERSION}" != "${package_version}" || "${RELEASE_VERSION}" != "${lock_version}" ]]; then
            echo "Tag, package.json, and package-lock.json versions must match: tag=${RELEASE_VERSION}, package=${package_version}, lock=${lock_version}" >&2
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Download patched agent-browser runtimes
        uses: actions/download-artifact@v4
        with:
          pattern: farming-agent-browser-*
          path: ${{ github.workspace }}/../release-agent-browser-artifacts
          merge-multiple: true

      - name: Set pinned download cache root
        shell: bash
        run: echo "FARMING_RIPGREP_ARCHIVE_CACHE=${RUNNER_TEMP}/farming-ripgrep-archives" >> "${GITHUB_ENV}"

      - name: Cache pinned ripgrep archives
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/farming-ripgrep-archives
          key: managed-ripgrep-v1-${{ runner.os }}-${{ runner.arch }}-build-linux-${{ hashFiles('backend/ripgrep-runtime.cts') }}

      - name: Install dependencies
        run: |
          npm install --global npm@12.0.2
          FARMING_SKIP_INSTALL_RUNTIME_PREPARE=1 PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 PUPPETEER_SKIP_DOWNLOAD=1 npm ci --registry=https://registry.npmjs.org/ --no-audit --no-fund

      - name: Setup Chrome for patched runtime smoke
        if: matrix.kind == 'app'
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-dependencies: true

      - name: Enable arm64 CLI smoke emulation
        if: matrix.kind == 'cli'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build Linux CLI
        if: matrix.kind == 'cli'
        env:
          FARMING_RELEASE_VERSION: ${{ steps.version.outputs.value }}
          FARMING_CLI_TARGETS: node22-linux-x64,node22-linux-arm64
        run: npm run release:cli

      - name: Smoke-test Linux CLI server
        if: matrix.kind == 'cli'
        env:
          FARMING_RELEASE_VERSION: ${{ steps.version.outputs.value }}
          FARMING_SMOKE_AGENT: "0"
        run: npm run release:cli:smoke -- "releases/${FARMING_RELEASE_VERSION}/farming_${FARMING_RELEASE_VERSION}_linux_amd64"

      - name: Smoke-test Linux arm64 CLI server and native PTY
        if: matrix.kind == 'cli'
        shell: bash
        run: |
          docker run --rm --platform linux/arm64 \
            -e FARMING_SKIP_RUNTIME_PREPARE=1 \
            -e FARMING_SMOKE_AGENT=0 \
            -v "$PWD/releases/${FARMING_RELEASE_VERSION}:/release:ro" \
            -v "$PWD/scripts:/scripts:ro" \
            node:22.17.0-bookworm \
            bash /scripts/smoke-cli-release.sh "/release/farming_${FARMING_RELEASE_VERSION}_linux_arm64"

      - name: Build Linux app bundle
        if: matrix.kind == 'app'
        env:
          FARMING_RELEASE_VERSION: ${{ steps.version.outputs.value }}
          FARMING_RELEASE_STAGE_ROOT: ${{ runner.temp }}/farming-release-stage-app
        run: npm run release:app

      - name: Smoke-test patched browser runtime on Linux
        if: matrix.kind == 'app'
        run: >-
          npx tsx scripts/smoke-browser-idle.ts
          "$PWD/dist/runtime/agent-browser/linux-x64/agent-browser"
          "${{ steps.setup-chrome.outputs.chrome-path }}"

      - name: Verify Linux app bundle
        if: matrix.kind == 'app'
        env:
          FARMING_RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: node --import tsx scripts/verify-release-bundle.ts "releases/${FARMING_RELEASE_VERSION}/farming-${FARMING_RELEASE_VERSION}-linux-x64.tar.gz"

      - name: Smoke-test Linux app bundle
        if: matrix.kind == 'app'
        env:
          FARMING_RELEASE_VERSION: ${{ steps.version.outputs.value }}
          FARMING_SMOKE_PORT: "6695"
        shell: bash
        run: |
          npm run release:cli:smoke -- "${RUNNER_TEMP}/farming-release-stage-app/farming-${FARMING_RELEASE_VERSION}-linux-x64/farming"

      - name: Build legacy Linux app bundle
        if: matrix.kind == 'legacy'
        env:
          FARMING_RELEASE_VERSION: ${{ steps.version.outputs.value }}
          FARMING_RELEASE_STAGE_ROOT: ${{ runner.temp }}/farming-release-stage-legacy
        run: npm run release:app:legacy-linux

      - name: Verify legacy Linux app bundle
        if: matrix.kind == 'legacy'
        env:
          FARMING_RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: node --import tsx scripts/verify-linux-legacy-release.ts "releases/${FARMING_RELEASE_VERSION}/farming-${FARMING_RELEASE_VERSION}-linux-x64-legacy-glibc228.tar.gz"

      - name: Smoke-test legacy Linux npm bootstrap and native PTY
        if: matrix.kind == 'legacy'
        env:
          FARMING_RELEASE_VERSION: ${{ steps.version.outputs.value }}
          FARMING_SMOKE_PORT: "6696"
        shell: bash
        run: |
          FARMING_USE_GLIBC_RUNTIME=1 npm run release:cli:smoke -- "${RUNNER_TEMP}/farming-release-stage-legacy/farming-${FARMING_RELEASE_VERSION}-linux-x64-legacy-glibc228/farming"

      - name: Collect Linux release assets
        env:
          FARMING_RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          mkdir -p release-upload
          case "${{ matrix.kind }}" in
            cli)
              cp "releases/${FARMING_RELEASE_VERSION}/farming_${FARMING_RELEASE_VERSION}_linux_amd64" release-upload/
              cp "releases/${FARMING_RELEASE_VERSION}/farming_${FARMING_RELEASE_VERSION}_linux_arm64" release-upload/
              for companion in LICENSE THIRD_PARTY_NOTICES.md LICENSE.pi-acp LICENSE.pi-acp-sdk LICENSE.pi-acp-zod; do
                cp "releases/${FARMING_RELEASE_VERSION}/${companion}" release-upload/
              done
              ;;
            app)
              archive="farming-${FARMING_RELEASE_VERSION}-linux-x64.tar.gz"
              cp "releases/${FARMING_RELEASE_VERSION}/${archive}" release-upload/
              cp "${RUNNER_TEMP}/farming-release-stage-app/farming-${FARMING_RELEASE_VERSION}-linux-x64/RELEASE.json" \
                "release-upload/release-metadata-${archive%.tar.gz}.json"
              ;;
            legacy)
              archive="farming-${FARMING_RELEASE_VERSION}-linux-x64-legacy-glibc228.tar.gz"
              cp "releases/${FARMING_RELEASE_VERSION}/${archive}" release-upload/
              cp "${RUNNER_TEMP}/farming-release-stage-legacy/farming-${FARMING_RELEASE_VERSION}-linux-x64-legacy-glibc228/RELEASE.json" \
                "release-upload/release-metadata-${archive%.tar.gz}.json"
              ;;
          esac

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: farming-linux-${{ steps.version.outputs.value }}-${{ matrix.kind }}
          path: release-upload/*
          if-no-files-found: error
          compression-level: 0

  build-macos:
    name: Build macOS ${{ matrix.arch }} ${{ matrix.kind }} artifacts
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
            kind: app
            cliTarget: node22-macos-x64
            cliAsset: darwin_amd64
          - runner: macos-15
            arch: arm64
            kind: app
            cliTarget: node22-macos-arm64
            cliAsset: darwin_arm64
    runs-on: ${{ matrix.runner }}
    needs: [preflight, build-macos-browser]
    env:
      FARMING_BASE_PATH: /farming
      FARMING_RELEASE_VERSION: ${{ inputs.release_version }}
      FARMING_RELEASE_INTEGRATION_REF: refs/remotes/origin/main
    steps:
      - name: Normalize release version
        id: version
        shell: bash
        run: |
          version="${FARMING_RELEASE_VERSION}"
          echo "value=${version}" >> "${GITHUB_OUTPUT}"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release version
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          lock_version="$(node -p "require('./package-lock.json').packages[''].version")"
          if [[ "${RELEASE_VERSION}" != "${package_version}" || "${RELEASE_VERSION}" != "${lock_version}" ]]; then
            echo "Tag, package.json, and package-lock.json versions must match: tag=${RELEASE_VERSION}, package=${package_version}, lock=${lock_version}" >&2
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Verify native runner architecture
        shell: bash
        run: |
          case "${{ matrix.arch }}:$(uname -m)" in
            x64:x86_64|arm64:arm64) ;;
            *) echo "Runner architecture does not match release target: target=${{ matrix.arch }}, host=$(uname -m)" >&2; exit 1 ;;
          esac

      - name: Set pinned download cache root
        shell: bash
        run: echo "FARMING_RIPGREP_ARCHIVE_CACHE=${RUNNER_TEMP}/farming-ripgrep-archives" >> "${GITHUB_ENV}"

      - name: Cache pinned ripgrep archives
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/farming-ripgrep-archives
          key: managed-ripgrep-v1-${{ runner.os }}-${{ runner.arch }}-build-macos-${{ hashFiles('backend/ripgrep-runtime.cts') }}

      - name: Install dependencies
        run: |
          npm install --global npm@12.0.2
          FARMING_SKIP_INSTALL_RUNTIME_PREPARE=1 PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 PUPPETEER_SKIP_DOWNLOAD=1 npm ci --registry=https://registry.npmjs.org/ --no-audit --no-fund

      - name: Verify system Chrome for patched runtime smoke
        if: matrix.kind == 'app'
        shell: bash
        run: |
          chrome="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
          test -x "${chrome}"
          "${chrome}" --version

      # Reuse only authenticated unchanged components. Restore native signing
      # and exercise Browser plus complete App on this packaging runner.
      - name: Download native candidate Browser
        uses: actions/download-artifact@v4
        with:
          name: farming-agent-browser-darwin-${{ matrix.arch }}
          path: ${{ runner.temp }}/native-browser-input
      - name: Restore and verify transferred native Browser
        shell: bash
        run: |
          native_artifacts="${RUNNER_TEMP}/native-agent-browser-artifacts"
          node scripts/transfer-native-browser-runtime.mjs "darwin-${{ matrix.arch }}" \
            "${RUNNER_TEMP}/native-browser-input" "${native_artifacts}"
          echo "FARMING_AGENT_BROWSER_ARTIFACTS=${native_artifacts}" >> "${GITHUB_ENV}"

      - name: Build native macOS CLI
        if: matrix.kind == 'cli'
        env:
          FARMING_RELEASE_VERSION: ${{ steps.version.outputs.value }}
          FARMING_CLI_TARGETS: ${{ matrix.cliTarget }}
        run: npm run release:cli

      - name: Smoke-test native macOS CLI
        if: matrix.kind == 'cli'
        env:
          FARMING_RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: npm run release:cli:smoke -- "releases/${FARMING_RELEASE_VERSION}/farming_${FARMING_RELEASE_VERSION}_${{ matrix.cliAsset }}"

      - name: Build macOS app bundle
        if: matrix.kind == 'app'
        env:
          FARMING_RELEASE_VERSION: ${{ steps.version.outputs.value }}
          FARMING_RELEASE_PLATFORM: darwin
          FARMING_RELEASE_ARCH: ${{ matrix.arch }}
          FARMING_RELEASE_STAGE_ROOT: ${{ runner.temp }}/farming-release-stage-app
        run: npm run release:app

      - name: Smoke-test patched browser runtime on macOS
        if: matrix.kind == 'app'
        run: >-
          npx tsx scripts/smoke-browser-idle.ts
          "$PWD/dist/runtime/agent-browser/darwin-${{ matrix.arch }}/agent-browser"
          "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"

      - name: Verify macOS app bundle
        if: matrix.kind == 'app'
        env:
          FARMING_RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: node --import tsx scripts/verify-release-bundle.ts "releases/${FARMING_RELEASE_VERSION}/farming-${FARMING_RELEASE_VERSION}-darwin-${{ matrix.arch }}.tar.gz"

      - name: Smoke-test macOS app bundle
        if: matrix.kind == 'app'
        env:
          FARMING_RELEASE_VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          npm run release:cli:smoke -- "${RUNNER_TEMP}/farming-release-stage-app/farming-${FARMING_RELEASE_VERSION}-darwin-${{ matrix.arch }}/farming"

      - name: Collect macOS release assets
        env:
          FARMING_RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          mkdir -p release-upload
          if [[ "${{ matrix.kind }}" == "cli" ]]; then
            cp "releases/${FARMING_RELEASE_VERSION}/farming_${FARMING_RELEASE_VERSION}_${{ matrix.cliAsset }}" release-upload/
          else
            archive="farming-${FARMING_RELEASE_VERSION}-darwin-${{ matrix.arch }}.tar.gz"
            cp "releases/${FARMING_RELEASE_VERSION}/${archive}" release-upload/
            cp "${RUNNER_TEMP}/farming-release-stage-app/farming-${FARMING_RELEASE_VERSION}-darwin-${{ matrix.arch }}/RELEASE.json" \
              "release-upload/release-metadata-${archive%.tar.gz}.json"
          fi

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: farming-macos-${{ steps.version.outputs.value }}-${{ matrix.arch }}-${{ matrix.kind }}
          path: release-upload/*
          if-no-files-found: error
          compression-level: 0

  build-macos-cli:
    name: Build macOS ${{ matrix.arch }} ${{ matrix.kind }} artifacts
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
            kind: cli
            cliTarget: node22-macos-x64
            cliAsset: darwin_amd64
          - runner: macos-15
            arch: arm64
            kind: cli
            cliTarget: node22-macos-arm64
            cliAsset: darwin_arm64
    runs-on: ${{ matrix.runner }}
    needs:
      - preflight
      - build-agent-browser
      - build-macos-browser
    env:
      FARMING_BASE_PATH: /farming
      FARMING_RELEASE_VERSION: ${{ inputs.release_version }}
      FARMING_RELEASE_INTEGRATION_REF: refs/remotes/origin/main
      FARMING_AGENT_BROWSER_ARTIFACTS: ${{ github.workspace }}/../release-agent-browser-artifacts
    steps:
      - name: Normalize release version
        id: version
        shell: bash
        run: |
          version="${FARMING_RELEASE_VERSION}"
          echo "value=${version}" >> "${GITHUB_OUTPUT}"
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify release version
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          lock_version="$(node -p "require('./package-lock.json').packages[''].version")"
          if [[ "${RELEASE_VERSION}" != "${package_version}" || "${RELEASE_VERSION}" != "${lock_version}" ]]; then
            echo "Tag, package.json, and package-lock.json versions must match: tag=${RELEASE_VERSION}, package=${package_version}, lock=${lock_version}" >&2
            exit 1
          fi
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Download patched agent-browser runtimes
        uses: actions/download-artifact@v4
        with:
          pattern: farming-agent-browser-*
          path: ${{ github.workspace }}/../release-agent-browser-artifacts
          merge-multiple: true
      - name: Verify native runner architecture
        shell: bash
        run: |
          case "${{ matrix.arch }}:$(uname -m)" in
            x64:x86_64|arm64:arm64) ;;
            *) echo "Runner architecture does not match release target: target=${{ matrix.arch }}, host=$(uname -m)" >&2; exit 1 ;;
          esac
      - name: Set pinned download cache root
        shell: bash
        run: echo "FARMING_RIPGREP_ARCHIVE_CACHE=${RUNNER_TEMP}/farming-ripgrep-archives" >> "${GITHUB_ENV}"

      - name: Cache pinned ripgrep archives
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/farming-ripgrep-archives
          key: managed-ripgrep-v1-${{ runner.os }}-${{ runner.arch }}-build-macos-cli-${{ hashFiles('backend/ripgrep-runtime.cts') }}

      - name: Install dependencies
        run: |
          npm install --global npm@12.0.2
          FARMING_SKIP_INSTALL_RUNTIME_PREPARE=1 PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 PUPPETEER_SKIP_DOWNLOAD=1 npm ci --registry=https://registry.npmjs.org/ --no-audit --no-fund
      - name: Build native macOS CLI
        env:
          FARMING_RELEASE_VERSION: ${{ steps.version.outputs.value }}
          FARMING_CLI_TARGETS: ${{ matrix.cliTarget }}
        run: npm run release:cli
      - name: Smoke-test native macOS CLI
        env:
          FARMING_RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: npm run release:cli:smoke -- "releases/${FARMING_RELEASE_VERSION}/farming_${FARMING_RELEASE_VERSION}_${{ matrix.cliAsset }}"
      - name: Collect macOS release assets
        env:
          FARMING_RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          mkdir -p release-upload
          if [[ "${{ matrix.kind }}" == "cli" ]]; then
            cp "releases/${FARMING_RELEASE_VERSION}/farming_${FARMING_RELEASE_VERSION}_${{ matrix.cliAsset }}" release-upload/
          else
            archive="farming-${FARMING_RELEASE_VERSION}-darwin-${{ matrix.arch }}.tar.gz"
            cp "releases/${FARMING_RELEASE_VERSION}/${archive}" release-upload/
            cp "${RUNNER_TEMP}/farming-release-stage-app/farming-${FARMING_RELEASE_VERSION}-darwin-${{ matrix.arch }}/RELEASE.json" \
              "release-upload/release-metadata-${archive%.tar.gz}.json"
          fi
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: farming-macos-${{ steps.version.outputs.value }}-${{ matrix.arch }}-${{ matrix.kind }}
          path: release-upload/*
          if-no-files-found: error
          compression-level: 0

  prepare-npm:
    name: Prepare and smoke npm package
    runs-on: ubuntu-latest
    needs: [preflight, build-agent-browser, build-macos-browser]
    permissions:
      contents: read
    env:
      FARMING_RELEASE_VERSION: ${{ inputs.release_version }}
      FARMING_RELEASE_INTEGRATION_REF: refs/remotes/origin/main
      FARMING_AGENT_BROWSER_ARTIFACTS: ${{ github.workspace }}/../release-agent-browser-artifacts
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Download patched agent-browser runtimes
        uses: actions/download-artifact@v4
        with:
          pattern: farming-agent-browser-*
          path: ${{ github.workspace }}/../release-agent-browser-artifacts
          merge-multiple: true

      - name: Install current npm CLI
        run: npm install --global npm@12.0.2

      - name: Set pinned download cache root
        shell: bash
        run: echo "FARMING_RIPGREP_ARCHIVE_CACHE=${RUNNER_TEMP}/farming-ripgrep-archives" >> "${GITHUB_ENV}"

      - name: Cache pinned ripgrep archives
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/farming-ripgrep-archives
          key: managed-ripgrep-v1-${{ runner.os }}-${{ runner.arch }}-prepare-npm-${{ hashFiles('backend/ripgrep-runtime.cts') }}

      - name: Install dependencies
        run: FARMING_SKIP_INSTALL_RUNTIME_PREPARE=1 PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 PUPPETEER_SKIP_DOWNLOAD=1 npm ci --registry=https://registry.npmjs.org/ --no-audit --no-fund

      - name: Build and smoke one npm tarball
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          if [[ "${RELEASE_VERSION}" != "${package_version}" ]]; then
            echo "release_version and npm package versions must match: requested=${RELEASE_VERSION}, package=${package_version}" >&2
            exit 1
          fi
          npm run test:update:npm
          package_dir="${RUNNER_TEMP}/farming-npm-package"
          npm run release:npm:pack -- "${package_dir}"
          package_tarball="${package_dir}/farming-code-${RELEASE_VERSION}.tgz"
          node scripts/with-npm-candidate-registry.mjs "${package_tarball}" npm run release:npm:smoke -- "${package_tarball}"
          node scripts/smoke-user-install.mjs "${package_tarball}"
          mkdir -p npm-upload
          node scripts/npm-release-evidence.mjs write "${package_tarball}" "farming-code@${RELEASE_VERSION}" "$(git rev-parse HEAD)" npm-upload/npm-smoke-receipt.json
          cp "${package_tarball}" "${package_dir}/runtime-packages.json" npm-upload/
          for runtime_tarball in "${package_dir}"/farming-code-*-runtime-*.tgz; do
            runtime_version="$(basename "${runtime_tarball}" .tgz)"
            runtime_version="${runtime_version#farming-code-}"
            platform="${runtime_version##*-runtime-}"
            node scripts/npm-release-evidence.mjs write "${runtime_tarball}" "farming-code@${runtime_version}" "$(git rev-parse HEAD)" "npm-upload/runtime-${platform}-receipt.json"
            cp "${runtime_tarball}" npm-upload/
          done

      - name: Upload npm smoke receipt
        uses: actions/upload-artifact@v4
        with:
          name: farming-npm-receipt-${{ inputs.release_version }}
          path: npm-upload/npm-smoke-receipt.json
          if-no-files-found: error

      - name: Upload verified npm tarball
        uses: actions/upload-artifact@v4
        with:
          name: farming-npm-${{ inputs.release_version }}
          path: npm-upload/*
          if-no-files-found: error
          compression-level: 0
