name: Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Package version to publish (for example, 2.2.33)'
        required: true
        type: string
      acceptance_context:
        description: 'Exact commit-status context created by the release acceptance coordinator'
        required: true
        type: string

permissions:
  actions: read
  contents: write
  statuses: read

jobs:
  preflight:
    name: Validate release candidate
    runs-on: ubuntu-latest
    env:
      FARMING_RELEASE_VERSION: ${{ inputs.release_version }}
    steps:
      - name: Require a branch dispatch
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" != "branch" ]]; then
            echo "Release candidates must be dispatched from a branch, not an existing tag." >&2
            exit 1
          fi

      - name: Normalize release version
        id: version
        shell: bash
        run: |
          version="${FARMING_RELEASE_VERSION}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "release_version must be an exact semver without a v prefix: ${version}" >&2
            exit 1
          fi
          echo "value=${version}" >> "${GITHUB_OUTPUT}"

      - name: Verify release acceptance context
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
          ACCEPTANCE_CONTEXT: ${{ inputs.acceptance_context }}
        shell: bash
        run: |
          expected_prefix="farming/release-acceptance/${RELEASE_VERSION}/"
          if [[ "${ACCEPTANCE_CONTEXT}" != "${expected_prefix}"* ]]; then
            echo "acceptance_context must start with ${expected_prefix}" >&2
            exit 1
          fi
          campaign_id="${ACCEPTANCE_CONTEXT#${expected_prefix}}"
          if [[ ! "${campaign_id}" =~ ^[0-9A-Za-z][0-9A-Za-z._-]{0,47}$ ]]; then
            echo "acceptance_context has an invalid campaign identifier." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org

      - name: Verify candidate versions and release notes
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          lock_version="$(node -p "require('./package-lock.json').packages[''].version")"
          notes_file="release-notes/v${RELEASE_VERSION}.md"
          if [[ "${RELEASE_VERSION}" != "${package_version}" || "${RELEASE_VERSION}" != "${lock_version}" ]]; then
            echo "release_version, package.json, and package-lock.json must match: requested=${RELEASE_VERSION}, package=${package_version}, lock=${lock_version}" >&2
            exit 1
          fi
          if [[ ! -f "${notes_file}" ]]; then
            echo "Missing release notes: ${notes_file}" >&2
            exit 1
          fi
          node scripts/verify-release-notes.mjs "${RELEASE_VERSION}"
          if npm view "farming-code@${RELEASE_VERSION}" version >/dev/null 2>&1; then
            candidate_sha="$(git rev-parse HEAD)"
            bash scripts/verify-npm-release-source.sh "farming-code@${RELEASE_VERSION}" "${candidate_sha}"
          fi

  build-linux:
    name: Build Linux ${{ matrix.kind }} artifacts
    runs-on: ubuntu-latest
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        kind: [cli, app, legacy]
    env:
      FARMING_BASE_PATH: /farming
      FARMING_RELEASE_VERSION: ${{ inputs.release_version }}
    steps:
      - name: Normalize release version
        id: version
        shell: bash
        run: |
          version="${FARMING_RELEASE_VERSION}"
          echo "value=${version}" >> "${GITHUB_OUTPUT}"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify release version
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          lock_version="$(node -p "require('./package-lock.json').packages[''].version")"
          if [[ "${RELEASE_VERSION}" != "${package_version}" || "${RELEASE_VERSION}" != "${lock_version}" ]]; then
            echo "Tag, package.json, and package-lock.json versions must match: tag=${RELEASE_VERSION}, package=${package_version}, lock=${lock_version}" >&2
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: FARMING_SKIP_INSTALL_RUNTIME_PREPARE=1 PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 PUPPETEER_SKIP_DOWNLOAD=1 npm ci --registry=https://registry.npmjs.org/ --no-audit --no-fund

      - name: Build Linux CLI
        if: matrix.kind == 'cli'
        env:
          FARMING_RELEASE_VERSION: ${{ steps.version.outputs.value }}
          FARMING_CLI_TARGETS: node22-linux-x64,node22-linux-arm64
        run: npm run release:cli

      - name: Smoke-test Linux CLI server
        if: matrix.kind == 'cli'
        env:
          FARMING_RELEASE_VERSION: ${{ steps.version.outputs.value }}
          FARMING_SMOKE_AGENT: "0"
        run: npm run release:cli:smoke -- "releases/${FARMING_RELEASE_VERSION}/farming_${FARMING_RELEASE_VERSION}_linux_amd64"

      - name: Build Linux app bundle
        if: matrix.kind == 'app'
        env:
          FARMING_RELEASE_VERSION: ${{ steps.version.outputs.value }}
          FARMING_RELEASE_STAGE_ROOT: ${{ runner.temp }}/farming-release-stage-app
        run: npm run release:app

      - name: Verify Linux app bundle
        if: matrix.kind == 'app'
        env:
          FARMING_RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: node --import tsx scripts/verify-release-bundle.ts "releases/${FARMING_RELEASE_VERSION}/farming-${FARMING_RELEASE_VERSION}-linux-x64.tar.gz"

      - name: Smoke-test Linux app bundle
        if: matrix.kind == 'app'
        env:
          FARMING_RELEASE_VERSION: ${{ steps.version.outputs.value }}
          FARMING_SMOKE_PORT: "6695"
        shell: bash
        run: |
          npm run release:cli:smoke -- "${RUNNER_TEMP}/farming-release-stage-app/farming-${FARMING_RELEASE_VERSION}-linux-x64/farming"

      - name: Build legacy Linux app bundle
        if: matrix.kind == 'legacy'
        env:
          FARMING_RELEASE_VERSION: ${{ steps.version.outputs.value }}
          FARMING_RELEASE_STAGE_ROOT: ${{ runner.temp }}/farming-release-stage-legacy
        run: npm run release:app:legacy-linux

      - name: Verify legacy Linux app bundle
        if: matrix.kind == 'legacy'
        env:
          FARMING_RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: node --import tsx scripts/verify-linux-legacy-release.ts "releases/${FARMING_RELEASE_VERSION}/farming-${FARMING_RELEASE_VERSION}-linux-x64-legacy-glibc228.tar.gz"

      - name: Smoke-test legacy Linux npm bootstrap and native PTY
        if: matrix.kind == 'legacy'
        env:
          FARMING_RELEASE_VERSION: ${{ steps.version.outputs.value }}
          FARMING_SMOKE_PORT: "6696"
        shell: bash
        run: |
          FARMING_USE_GLIBC_RUNTIME=1 npm run release:cli:smoke -- "${RUNNER_TEMP}/farming-release-stage-legacy/farming-${FARMING_RELEASE_VERSION}-linux-x64-legacy-glibc228/farming"

      - name: Collect Linux release assets
        env:
          FARMING_RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          mkdir -p release-upload
          case "${{ matrix.kind }}" in
            cli)
              cp "releases/${FARMING_RELEASE_VERSION}/farming_${FARMING_RELEASE_VERSION}_linux_amd64" release-upload/
              cp "releases/${FARMING_RELEASE_VERSION}/farming_${FARMING_RELEASE_VERSION}_linux_arm64" release-upload/
              ;;
            app)
              archive="farming-${FARMING_RELEASE_VERSION}-linux-x64.tar.gz"
              cp "releases/${FARMING_RELEASE_VERSION}/${archive}" release-upload/
              cp "${RUNNER_TEMP}/farming-release-stage-app/farming-${FARMING_RELEASE_VERSION}-linux-x64/RELEASE.json" \
                "release-upload/release-metadata-${archive%.tar.gz}.json"
              ;;
            legacy)
              archive="farming-${FARMING_RELEASE_VERSION}-linux-x64-legacy-glibc228.tar.gz"
              cp "releases/${FARMING_RELEASE_VERSION}/${archive}" release-upload/
              cp "${RUNNER_TEMP}/farming-release-stage-legacy/farming-${FARMING_RELEASE_VERSION}-linux-x64-legacy-glibc228/RELEASE.json" \
                "release-upload/release-metadata-${archive%.tar.gz}.json"
              ;;
          esac

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: farming-linux-${{ steps.version.outputs.value }}-${{ matrix.kind }}
          path: release-upload/*
          if-no-files-found: error
          compression-level: 0

  build-macos:
    name: Build macOS ${{ matrix.arch }} ${{ matrix.kind }} artifacts
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
            kind: cli
            cliTarget: node22-macos-x64
            cliAsset: darwin_amd64
          - runner: macos-15-intel
            arch: x64
            kind: app
            cliTarget: node22-macos-x64
            cliAsset: darwin_amd64
          - runner: macos-15
            arch: arm64
            kind: cli
            cliTarget: node22-macos-arm64
            cliAsset: darwin_arm64
          - runner: macos-15
            arch: arm64
            kind: app
            cliTarget: node22-macos-arm64
            cliAsset: darwin_arm64
    runs-on: ${{ matrix.runner }}
    needs: preflight
    env:
      FARMING_BASE_PATH: /farming
      FARMING_RELEASE_VERSION: ${{ inputs.release_version }}
    steps:
      - name: Normalize release version
        id: version
        shell: bash
        run: |
          version="${FARMING_RELEASE_VERSION}"
          echo "value=${version}" >> "${GITHUB_OUTPUT}"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify release version
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          lock_version="$(node -p "require('./package-lock.json').packages[''].version")"
          if [[ "${RELEASE_VERSION}" != "${package_version}" || "${RELEASE_VERSION}" != "${lock_version}" ]]; then
            echo "Tag, package.json, and package-lock.json versions must match: tag=${RELEASE_VERSION}, package=${package_version}, lock=${lock_version}" >&2
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Verify native runner architecture
        shell: bash
        run: |
          case "${{ matrix.arch }}:$(uname -m)" in
            x64:x86_64|arm64:arm64) ;;
            *) echo "Runner architecture does not match release target: target=${{ matrix.arch }}, host=$(uname -m)" >&2; exit 1 ;;
          esac

      - name: Install dependencies
        run: FARMING_SKIP_INSTALL_RUNTIME_PREPARE=1 PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 PUPPETEER_SKIP_DOWNLOAD=1 npm ci --registry=https://registry.npmjs.org/ --no-audit --no-fund

      - name: Build native macOS CLI
        if: matrix.kind == 'cli'
        env:
          FARMING_RELEASE_VERSION: ${{ steps.version.outputs.value }}
          FARMING_CLI_TARGETS: ${{ matrix.cliTarget }}
        run: npm run release:cli

      - name: Smoke-test native macOS CLI
        if: matrix.kind == 'cli'
        env:
          FARMING_RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: npm run release:cli:smoke -- "releases/${FARMING_RELEASE_VERSION}/farming_${FARMING_RELEASE_VERSION}_${{ matrix.cliAsset }}"

      - name: Build macOS app bundle
        if: matrix.kind == 'app'
        env:
          FARMING_RELEASE_VERSION: ${{ steps.version.outputs.value }}
          FARMING_RELEASE_PLATFORM: darwin
          FARMING_RELEASE_ARCH: ${{ matrix.arch }}
          FARMING_RELEASE_STAGE_ROOT: ${{ runner.temp }}/farming-release-stage-app
        run: npm run release:app

      - name: Verify macOS app bundle
        if: matrix.kind == 'app'
        env:
          FARMING_RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: node --import tsx scripts/verify-release-bundle.ts "releases/${FARMING_RELEASE_VERSION}/farming-${FARMING_RELEASE_VERSION}-darwin-${{ matrix.arch }}.tar.gz"

      - name: Smoke-test macOS app bundle
        if: matrix.kind == 'app'
        env:
          FARMING_RELEASE_VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          npm run release:cli:smoke -- "${RUNNER_TEMP}/farming-release-stage-app/farming-${FARMING_RELEASE_VERSION}-darwin-${{ matrix.arch }}/farming"

      - name: Collect macOS release assets
        env:
          FARMING_RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          mkdir -p release-upload
          if [[ "${{ matrix.kind }}" == "cli" ]]; then
            cp "releases/${FARMING_RELEASE_VERSION}/farming_${FARMING_RELEASE_VERSION}_${{ matrix.cliAsset }}" release-upload/
          else
            archive="farming-${FARMING_RELEASE_VERSION}-darwin-${{ matrix.arch }}.tar.gz"
            cp "releases/${FARMING_RELEASE_VERSION}/${archive}" release-upload/
            cp "${RUNNER_TEMP}/farming-release-stage-app/farming-${FARMING_RELEASE_VERSION}-darwin-${{ matrix.arch }}/RELEASE.json" \
              "release-upload/release-metadata-${archive%.tar.gz}.json"
          fi

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: farming-macos-${{ steps.version.outputs.value }}-${{ matrix.arch }}-${{ matrix.kind }}
          path: release-upload/*
          if-no-files-found: error
          compression-level: 0

  prepare-npm:
    name: Prepare and smoke npm package
    runs-on: ubuntu-latest
    needs: preflight
    permissions:
      contents: read
    env:
      FARMING_RELEASE_VERSION: ${{ inputs.release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install current npm CLI
        run: npm install --global npm@latest

      - name: Install dependencies
        run: FARMING_SKIP_INSTALL_RUNTIME_PREPARE=1 PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 PUPPETEER_SKIP_DOWNLOAD=1 npm ci --registry=https://registry.npmjs.org/ --no-audit --no-fund

      - name: Build and smoke one npm tarball
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          if [[ "${RELEASE_VERSION}" != "${package_version}" ]]; then
            echo "release_version and npm package versions must match: requested=${RELEASE_VERSION}, package=${package_version}" >&2
            exit 1
          fi
          package_dir="${RUNNER_TEMP}/farming-npm-package"
          npm run release:npm:pack -- "${package_dir}"
          package_tarball="${package_dir}/farming-code-${RELEASE_VERSION}.tgz"
          npm run release:npm:smoke -- "${package_tarball}"
          mkdir -p npm-upload
          cp "${package_tarball}" npm-upload/
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${package_tarball}" | sed 's#  .*/#  #' > "npm-upload/farming-code-${RELEASE_VERSION}.tgz.sha256"
          else
            shasum -a 256 "${package_tarball}" | sed 's#  .*/#  #' > "npm-upload/farming-code-${RELEASE_VERSION}.tgz.sha256"
          fi

      - name: Upload verified npm tarball
        uses: actions/upload-artifact@v4
        with:
          name: farming-npm-${{ inputs.release_version }}
          path: npm-upload/*
          if-no-files-found: error
          compression-level: 0

  stage-release:
    name: Publish verified release
    runs-on: ubuntu-latest
    needs:
      - build-linux
      - build-macos
      - prepare-npm
    env:
      FARMING_RELEASE_VERSION: ${{ inputs.release_version }}
      GH_TOKEN: ${{ github.token }}
    permissions:
      actions: read
      contents: write
      id-token: write
      statuses: read
    steps:
      - name: Normalize release version
        id: version
        shell: bash
        run: |
          version="${FARMING_RELEASE_VERSION}"
          echo "value=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${version}" >> "${GITHUB_OUTPUT}"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org

      - name: Install current npm CLI
        run: npm install --global npm@latest

      - name: Download verified npm tarball
        uses: actions/download-artifact@v4
        with:
          name: farming-npm-${{ inputs.release_version }}
          path: npm-package

      - name: Verify release notes
        id: notes
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          lock_version="$(node -p "require('./package-lock.json').packages[''].version")"
          if [[ "${RELEASE_VERSION}" != "${package_version}" || "${RELEASE_VERSION}" != "${lock_version}" ]]; then
            echo "Tag, package.json, and package-lock.json versions must match: tag=${RELEASE_VERSION}, package=${package_version}, lock=${lock_version}" >&2
            exit 1
          fi
          notes_file="release-notes/v${RELEASE_VERSION}.md"
          if [[ ! -f "${notes_file}" ]]; then
            echo "Missing release notes: ${notes_file}" >&2
            exit 1
          fi
          node scripts/verify-release-notes.mjs "${RELEASE_VERSION}"
          codename="$(node scripts/verify-release-notes.mjs "${RELEASE_VERSION}" --codename)"
          body_file="${RUNNER_TEMP}/release-notes-v${RELEASE_VERSION}.md"
          NOTES_FILE="${notes_file}" BODY_FILE="${body_file}" node <<'NODE'
          const fs = require('fs');
          const version = process.env.RELEASE_VERSION;
          let body = fs.readFileSync(process.env.NOTES_FILE, 'utf8');
          body = body.replaceAll(`](./v${version}.zh_cn.md)`, `](./release-notes/v${version}.zh_cn.md)`);
          body = body.replaceAll(`](./v${version}.md)`, `](./release-notes/v${version}.md)`);
          fs.writeFileSync(process.env.BODY_FILE, body);
          NODE
          echo "file=${body_file}" >> "${GITHUB_OUTPUT}"
          echo "codename=${codename}" >> "${GITHUB_OUTPUT}"

      - name: Download Linux release assets
        uses: actions/download-artifact@v4
        with:
          pattern: farming-linux-${{ steps.version.outputs.value }}-*
          path: release-assets
          merge-multiple: true

      - name: Download macOS release assets
        uses: actions/download-artifact@v4
        with:
          pattern: farming-macos-${{ steps.version.outputs.value }}-*
          path: release-assets
          merge-multiple: true

      - name: Generate checksums and manifest
        env:
          FARMING_RELEASE_VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          cd release-assets
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum farming* > "farming_${FARMING_RELEASE_VERSION}_checksums.txt"
          else
            shasum -a 256 farming* > "farming_${FARMING_RELEASE_VERSION}_checksums.txt"
          fi
          node <<'NODE'
          const fs = require('fs');
          const version = process.env.FARMING_RELEASE_VERSION;
          const checksumLines = fs.readFileSync(`farming_${version}_checksums.txt`, 'utf8')
            .split(/\r?\n/)
            .filter(Boolean);
          const checksums = new Map(checksumLines.map((line) => {
            const match = line.match(/^([a-f0-9]{64})\s+\*?(.+)$/i);
            if (!match) throw new Error(`Invalid checksum entry: ${line}`);
            return [match[2], match[1].toLowerCase()];
          }));
          function checksumFor(file) {
            const value = checksums.get(file);
            if (!value) throw new Error(`Missing generated checksum for ${file}`);
            return value;
          }
          function readBundleRelease(file) {
            const metadataFile = `release-metadata-${file.slice(0, -'.tar.gz'.length)}.json`;
            if (!fs.existsSync(metadataFile)) {
              throw new Error(`Release artifact is missing verified metadata: ${metadataFile}`);
            }
            return JSON.parse(fs.readFileSync(metadataFile, 'utf8'));
          }
          const files = fs.readdirSync('.')
            .filter((file) => file.startsWith('farming'))
            .filter((file) => !file.endsWith('_checksums.txt'))
            .sort();
          const assets = files.map((file) => {
            const cliMatch = file.match(/^farming_(.+)_(darwin|linux)_(amd64|arm64)$/);
            if (cliMatch) {
              return {
                type: 'cli',
                file,
                sha256: checksumFor(file),
                releaseVersion: cliMatch[1],
                platform: cliMatch[2],
                arch: cliMatch[3],
              };
            }
            const bundleMatch = file.match(/^farming-(.+)-(darwin|linux)-(x64|arm64)(-legacy-glibc228)?\.tar\.gz$/);
            if (bundleMatch) {
              const bundle = readBundleRelease(file);
              return {
                type: 'app-bundle',
                file,
                sha256: checksumFor(file),
                releaseVersion: bundleMatch[1],
                packageVersion: bundle.packageVersion || '',
                gitSha: bundle.gitSha || '',
                platform: bundle.platform || bundleMatch[2],
                arch: bundle.arch || bundleMatch[3],
                compatibilityProfile: bundle.compatibilityProfile || (bundleMatch[4] ? 'linux-x64-legacy-glibc228' : ''),
                bundledNodeModules: bundle.bundledNodeModules === true,
                bundledGlibcRuntime: bundle.bundledGlibcRuntime === true,
              };
            }
            return { type: 'unknown', file };
          });
          const manifest = {
            name: 'farming',
            releaseVersion: version,
            tag: `v${version}`,
            gitSha: process.env.GITHUB_SHA,
            basePath: '/farming',
            sourceIncluded: false,
            builtAt: new Date().toISOString(),
            assets,
          };
          fs.writeFileSync('manifest.json', `${JSON.stringify(manifest, null, 2)}\n`);
          NODE
          rm release-metadata-*.json

      - name: Require successful CI for candidate revision
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          ci_run_id=""
          for attempt in {1..60}; do
            ci_run_id="$(
              gh run list \
                --repo "${GITHUB_REPOSITORY}" \
                --workflow ci.yml \
                --commit "${GITHUB_SHA}" \
                --event push \
                --limit 1 \
                --json databaseId \
                --jq '.[0].databaseId // empty'
            )"
            if [[ -n "${ci_run_id}" ]]; then
              break
            fi
            if [[ "${attempt}" -eq 60 ]]; then
              echo "No push CI run found for release candidate ${GITHUB_SHA}." >&2
              exit 1
            fi
            sleep 5
          done

          echo "Release candidate is gated by CI run ${ci_run_id} for ${GITHUB_SHA}."
          gh run watch "${ci_run_id}" \
            --repo "${GITHUB_REPOSITORY}" \
            --exit-status \
            --interval 5

      - name: Require successful automated and Computer Use acceptance
        env:
          ACCEPTANCE_CONTEXT: ${{ inputs.acceptance_context }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for attempt in {1..120}; do
            commit_status="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/status")"
            acceptance_state="$(
              STATUS_JSON="${commit_status}" CONTEXT="${ACCEPTANCE_CONTEXT}" node <<'NODE'
          const payload = JSON.parse(process.env.STATUS_JSON);
          const match = (payload.statuses || []).find(status => status.context === process.env.CONTEXT);
          process.stdout.write(match?.state || 'missing');
          NODE
            )"
            case "${acceptance_state}" in
              success)
                echo "Release acceptance succeeded for ${GITHUB_SHA}: ${ACCEPTANCE_CONTEXT}"
                exit 0
                ;;
              failure|error)
                echo "Release acceptance ended in ${acceptance_state}: ${ACCEPTANCE_CONTEXT}" >&2
                exit 1
                ;;
              pending|missing) ;;
              *)
                echo "Unexpected release acceptance state: ${acceptance_state}" >&2
                exit 1
                ;;
            esac
            if [[ "${attempt}" -eq 120 ]]; then
              echo "Timed out waiting for release acceptance: ${ACCEPTANCE_CONTEXT}" >&2
              exit 1
            fi
            sleep 5
          done

      - name: Create or refresh draft release
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
          RELEASE_CODENAME: ${{ steps.notes.outputs.codename }}
          RELEASE_NOTES_FILE: ${{ steps.notes.outputs.file }}
        shell: bash
        run: |
          set -euo pipefail
          release_args=(--repo "${GITHUB_REPOSITORY}")
          candidate_sha="$(git rev-parse HEAD)"
          tag_created=0
          release_created=0
          cleanup() {
            status=$?
            if [[ "${status}" -ne 0 && "${release_created}" -eq 1 ]]; then
              gh release delete "${RELEASE_TAG}" --yes "${release_args[@]}" || true
            fi
            if [[ "${status}" -ne 0 && "${tag_created}" -eq 1 ]]; then
              git push origin ":refs/tags/${RELEASE_TAG}" || true
            fi
            exit "${status}"
          }
          trap cleanup EXIT

          remote_tag_sha="$(git ls-remote origin "refs/tags/${RELEASE_TAG}^{}" | awk '{print $1}')"
          if [[ -z "${remote_tag_sha}" ]]; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              tag -a "${RELEASE_TAG}" -m "Farming ${RELEASE_VERSION}" "${candidate_sha}"
            git push origin "refs/tags/${RELEASE_TAG}"
            tag_created=1
          elif [[ "${remote_tag_sha}" != "${candidate_sha}" ]]; then
            echo "Existing tag ${RELEASE_TAG} does not identify this candidate: tag=${remote_tag_sha}, candidate=${candidate_sha}" >&2
            exit 1
          fi

          release_json="$(gh release view "${RELEASE_TAG}" "${release_args[@]}" --json isDraft 2>/dev/null || true)"
          if [[ -n "${release_json}" ]]; then
            is_draft="$(RELEASE_JSON="${release_json}" node -p "JSON.parse(process.env.RELEASE_JSON).isDraft")"
            if [[ "${is_draft}" != "true" ]]; then
              exit 0
            fi
            gh release upload "${RELEASE_TAG}" release-assets/* --clobber "${release_args[@]}"
            gh release edit "${RELEASE_TAG}" --title "Farming ${RELEASE_VERSION} · ${RELEASE_CODENAME}" --notes-file "${RELEASE_NOTES_FILE}" "${release_args[@]}"
          else
            create_args=(
              "${RELEASE_TAG}"
              release-assets/*
              --draft
              --verify-tag
              --title "Farming ${RELEASE_VERSION} · ${RELEASE_CODENAME}"
              --notes-file "${RELEASE_NOTES_FILE}"
            )
            if [[ "${RELEASE_VERSION}" == *-* ]]; then
              create_args+=(--prerelease)
            fi
            gh release create "${create_args[@]}" "${release_args[@]}"
            release_created=1
          fi

      - name: Publish the matching draft release
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          candidate_sha="${GITHUB_SHA}"
          remote_tag_sha="$(git ls-remote "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${tag}^{}" | awk '{print $1}')"
          if [[ "${remote_tag_sha}" != "${candidate_sha}" ]]; then
            echo "Release tag ${tag} does not identify this candidate: tag=${remote_tag_sha:-missing}, candidate=${candidate_sha}" >&2
            exit 1
          fi
          release_json="$(gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" --json isDraft)"
          is_draft="$(RELEASE_JSON="${release_json}" node -p "JSON.parse(process.env.RELEASE_JSON).isDraft")"
          if [[ "${is_draft}" == "true" ]]; then
            gh release edit "${tag}" --repo "${GITHUB_REPOSITORY}" --draft=false
          fi

      - name: Verify public tag, assets, and manifest
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          candidate_sha="${GITHUB_SHA}"
          remote_tag_sha="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${tag}^{}" | awk '{print $1}')"
          if [[ "${remote_tag_sha}" != "${candidate_sha}" ]]; then
            echo "Public tag ${tag} does not identify this candidate: tag=${remote_tag_sha:-missing}, candidate=${candidate_sha}" >&2
            exit 1
          fi

          release_json="$(curl --fail --silent --show-error --location \
            --header 'Accept: application/vnd.github+json' \
            --header 'User-Agent: farming-release-verifier' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${tag}")"
          release_dir="${RUNNER_TEMP}/public-release"
          mkdir -p "${release_dir}"
          RELEASE_JSON="${release_json}" RELEASE_VERSION="${RELEASE_VERSION}" node - "${candidate_sha}" "${release_dir}" <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const [candidateSha, releaseDir] = process.argv.slice(2);
          const version = process.env.RELEASE_VERSION;
          const release = JSON.parse(process.env.RELEASE_JSON);
          if (release.draft) throw new Error(`GitHub Release v${version} is still a draft`);
          const required = [
            `farming_${version}_linux_amd64`,
            `farming_${version}_linux_arm64`,
            `farming_${version}_darwin_amd64`,
            `farming_${version}_darwin_arm64`,
            `farming-${version}-linux-x64.tar.gz`,
            `farming-${version}-linux-x64-legacy-glibc228.tar.gz`,
            `farming-${version}-darwin-x64.tar.gz`,
            `farming-${version}-darwin-arm64.tar.gz`,
            `farming_${version}_checksums.txt`,
            'manifest.json',
          ];
          const assets = new Map((release.assets || []).map(asset => [asset.name, asset.browser_download_url]));
          const missing = required.filter(name => !assets.has(name));
          if (missing.length) throw new Error(`GitHub Release is missing assets: ${missing.join(', ')}`);
          fs.writeFileSync(path.join(releaseDir, 'manifest.url'), assets.get('manifest.json'));
          fs.writeFileSync(path.join(releaseDir, 'checksums.url'), assets.get(`farming_${version}_checksums.txt`));
          fs.writeFileSync(path.join(releaseDir, 'probe.url'), assets.get(`farming_${version}_linux_amd64`));
          fs.writeFileSync(path.join(releaseDir, 'candidate.sha'), candidateSha);
          NODE
          curl --fail --silent --show-error --location \
            "$(cat "${release_dir}/manifest.url")" --output "${release_dir}/manifest.json"
          curl --fail --silent --show-error --location \
            "$(cat "${release_dir}/checksums.url")" --output "${release_dir}/checksums.txt"
          probe_name="farming_${RELEASE_VERSION}_linux_amd64"
          curl --fail --silent --show-error --location \
            "$(cat "${release_dir}/probe.url")" --output "${release_dir}/${probe_name}"
          node - "${release_dir}/manifest.json" "${candidate_sha}" "${RELEASE_VERSION}" <<'NODE'
          const fs = require('fs');
          const [manifestPath, candidateSha, version] = process.argv.slice(2);
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          if (manifest.gitSha !== candidateSha || manifest.releaseVersion !== version) {
            throw new Error(`Public manifest mismatch: sha=${manifest.gitSha}, version=${manifest.releaseVersion}`);
          }
          NODE
          expected_probe_sha="$(awk -v file="${probe_name}" '$2 == file {print $1}' "${release_dir}/checksums.txt")"
          actual_probe_sha="$(sha256sum "${release_dir}/${probe_name}" | awk '{print $1}')"
          if [[ -z "${expected_probe_sha}" || "${actual_probe_sha}" != "${expected_probe_sha}" ]]; then
            echo "Public release asset checksum mismatch for ${probe_name}" >&2
            exit 1
          fi

      - name: Verify and publish npm package with provenance
        env:
          FARMING_RELEASE_VERSION: ${{ steps.version.outputs.value }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${NPM_TOKEN}" ]]; then
            printf '//registry.npmjs.org/:_authToken=%s\n' "${NPM_TOKEN}" > "${HOME}/.npmrc"
          fi
          version="${FARMING_RELEASE_VERSION}"
          candidate_sha="${GITHUB_SHA}"
          package_tarball="npm-package/farming-code-${version}.tgz"
          digest_file="${package_tarball}.sha256"
          test -f "${package_tarball}"
          test -f "${digest_file}"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd npm-package && sha256sum --check "$(basename "${digest_file}")")
          else
            expected="$(awk '{print $1}' "${digest_file}")"
            actual="$(shasum -a 256 "${package_tarball}" | awk '{print $1}')"
            [[ "${actual}" == "${expected}" ]]
          fi
          if npm view "farming-code@${version}" version >/dev/null 2>&1; then
            bash scripts/verify-npm-release-source.sh "farming-code@${version}" "${candidate_sha}"
            exit 0
          fi
          dist_tag="latest"
          if [[ "${version}" == *-* ]]; then
            dist_tag="next"
          fi
          npm publish "./${package_tarball}" --access public --provenance --tag "${dist_tag}" --loglevel=error
          bash scripts/verify-npm-release-source.sh "farming-code@${version}" "${candidate_sha}"
