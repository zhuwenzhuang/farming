name: CI

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
  pull_request:

permissions:
  contents: read

# A repository checkout builds and tests runtime contracts directly. Running the
# installed-package postinstall here downloads hundreds of megabytes of fixed
# runtimes into a throwaway seed on every job and is neither used nor published.
env:
  FARMING_SKIP_INSTALL_RUNTIME_PREPARE: '1'
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
  PUPPETEER_SKIP_DOWNLOAD: '1'

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org/ --no-audit --no-fund

      - name: Run checks
        run: npm run check

      # Tests own the cleanup of everything they create. Asserting this after the
      # gate keeps leftovers from being normalized away by widening .gitignore.
      - name: Assert the working tree stayed clean
        run: npx tsx scripts/assert-clean-workspace.ts

      - name: Audit production dependencies
        run: npm audit --omit=dev

  # Browser feedback must not wait behind typecheck, lint, unit tests, and the
  # dependency audit. Build the shared frontend bundle independently while the
  # authoritative Check and Node 24 jobs run in parallel.
  frontend:
    name: Frontend artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org/ --no-audit --no-fund

      - name: Build frontend
        run: FARMING_BASE_PATH=/farming npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  # Keep the small set of product promises that have repeatedly regressed as a
  # named, unsharded gate. The complete Chromium matrix still provides broad
  # coverage; this job makes critical behavior ownership and failures visible.
  behavior:
    name: Critical behavior
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org/ --no-audit --no-fund

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Prepare behavior runtimes
        run: |
          npm run build:backend-runtime
          npm run build:classic-runtime
          npm run build:usage-history
          npm run prepare:runtime-manifest

      - name: Validate behavior contracts
        run: npm run test:behavior:contracts

      - name: Run critical Node behavior evidence
        run: npm run test:behavior:node

      - name: Resolve Playwright version
        id: playwright
        run: |
          echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ steps.playwright.outputs.version }}

      - name: Install Chromium system dependencies
        run: npx playwright install-deps chromium

      - name: Install Chromium for behavior checks
        run: npx playwright install chromium

      - name: Run critical browser behavior
        run: npm run test:behavior:e2e
        env:
          FARMING_PLAYWRIGHT_SKIP_BUILD: '1'

      - name: Upload critical behavior failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: critical-behavior-failure
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 3

  # Node 22 stays the authoritative gate and keeps sole ownership of lint, the
  # dependency audit, and the Chromium shards. This job only
  # proves the >=24 compatibility floor still typechecks and passes the test
  # suite, so it costs one extra parallel job instead of a full matrix.
  node24:
    name: Node 24 compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org/ --no-audit --no-fund

      - name: Typecheck on Node 24
        run: npm run typecheck

      - name: Run tests on Node 24
        run: npm test

  browser:
    name: Chromium (${{ matrix.shard }}/9)
    needs: frontend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8, 9]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org/ --no-audit --no-fund

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      # The artifact only carries dist/. These prebuild outputs land next to
      # their sources instead, so every shard still runs the four cheap
      # transpile/codegen steps to reach the same state a full `npm run build`
      # left behind. Only `prepare:acp-vendor` is skipped, because it writes into
      # dist/acp and therefore rides along in the artifact.
      - name: Prepare backend runtime
        run: npm run build:backend-runtime

      - name: Prepare classic frontend runtime
        run: npm run build:classic-runtime

      - name: Prepare usage history scanner
        run: npm run build:usage-history

      - name: Prepare runtime dependency manifest
        run: npm run prepare:runtime-manifest

      - name: Resolve Playwright version
        id: playwright
        run: |
          echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ steps.playwright.outputs.version }}

      # Split from the browser download on purpose: the apt packages behind
      # `--with-deps` are not part of the cached browser directory, while
      # `install chromium` is a no-op once the cache restores.
      - name: Install Chromium system dependencies
        run: npx playwright install-deps chromium

      - name: Install Chromium for browser checks
        run: npx playwright install chromium

      - name: Run Chromium browser checks
        run: node scripts/run-playwright-balanced-shard.mjs --project chromium --shard ${{ matrix.shard }}/9
        env:
          FARMING_PLAYWRIGHT_SKIP_BUILD: '1'

      - name: Upload Chromium failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-failure-${{ matrix.shard }}
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 3

  # The iphone-webkit project was defined but never gated, so mobile layout and
  # WebKit regressions could only be caught by hand. It is a single spec with no
  # screenshot baselines, so it runs unsharded next to the Chromium matrix.
  mobile:
    name: iPhone WebKit
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org/ --no-audit --no-fund

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Prepare backend runtime
        run: npm run build:backend-runtime

      - name: Prepare classic frontend runtime
        run: npm run build:classic-runtime

      - name: Prepare usage history scanner
        run: npm run build:usage-history

      - name: Prepare runtime dependency manifest
        run: npm run prepare:runtime-manifest

      - name: Resolve Playwright version
        id: playwright
        run: |
          echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-webkit-${{ steps.playwright.outputs.version }}

      - name: Install WebKit system dependencies
        run: npx playwright install-deps webkit

      - name: Install WebKit for mobile checks
        run: npx playwright install webkit

      - name: Run iPhone WebKit checks
        run: npx playwright test --project=iphone-webkit
        env:
          FARMING_PLAYWRIGHT_SKIP_BUILD: '1'

      - name: Upload iPhone WebKit failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-webkit-failure
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 3
