<!DOCTYPE html>
<html lang="en" data-appearance-preference="system">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />
    <!-- appearance-bootstrap:start -->
    <style id="farming-appearance-bootstrap-style">
      html,
      body {
        background: #ffffff;
      }

      html[data-appearance='dark'],
      html[data-appearance='dark'] body {
        background: #181818;
        color-scheme: dark;
      }

      html[data-appearance='paper'],
      html[data-appearance='paper'] body {
        background: #f7f4ec;
        color-scheme: light;
      }
    </style>
    <script>
      (() => {
        const themes = {"light":{"canvas":"#ffffff","colorScheme":"light","themeColor":"#ffffff"},"dark":{"canvas":"#181818","colorScheme":"dark","themeColor":"#181818"},"paper":{"canvas":"#f7f4ec","colorScheme":"light","themeColor":"#f7f4ec"}}
        const root = document.documentElement
        const preference = Object.hasOwn(themes, root.dataset.appearancePreference)
          ? root.dataset.appearancePreference
          : 'system'
        const appearance = preference === 'system'
          ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : preference
        const theme = themes[appearance]
        root.dataset.appearance = appearance
        document.querySelector('meta[name="color-scheme"]')?.setAttribute('content', theme.colorScheme)
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', theme.themeColor)
      })()
    </script>
    <!-- appearance-bootstrap:end -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Farming 2" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="%BASE_URL%farming-2/favicon-v2.ico" sizes="any" />
    <link rel="icon" type="image/png" href="%BASE_URL%farming-2/favicon-v2-16.png" sizes="16x16" />
    <link rel="icon" type="image/png" href="%BASE_URL%farming-2/favicon-v2-32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="%BASE_URL%farming-2/favicon-v2-48.png" sizes="48x48" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%farming-2/app-icon-v2-180.png" />
    <link rel="manifest" href="%BASE_URL%farming-2/site.webmanifest" />
    <title>Farming 2</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
