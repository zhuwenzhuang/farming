<!DOCTYPE html>
<html lang="en" data-appearance-preference="system">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f8f4e8" />
    <style>
      html,
      body {
        background: #ffffff;
      }

      html[data-appearance='dark'],
      html[data-appearance='dark'] body {
        background: #0d1117;
        color-scheme: dark;
      }
    </style>
    <script>
      (() => {
        const root = document.documentElement
        const preference = ['light', 'dark'].includes(root.dataset.appearancePreference)
          ? root.dataset.appearancePreference
          : 'system'
        const appearance = preference === 'system'
          ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : preference
        root.dataset.appearance = appearance
        document.querySelector('meta[name="theme-color"]')?.setAttribute(
          'content',
          appearance === 'dark' ? '#0d1117' : '#f8f4e8',
        )
      })()
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Farming 2" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="%BASE_URL%farming-2/favicon-v2.ico" sizes="any" />
    <link rel="icon" type="image/png" href="%BASE_URL%farming-2/favicon-v2-16.png" sizes="16x16" />
    <link rel="icon" type="image/png" href="%BASE_URL%farming-2/favicon-v2-32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="%BASE_URL%farming-2/favicon-v2-48.png" sizes="48x48" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%farming-2/app-icon-v2-180.png" />
    <link rel="manifest" href="%BASE_URL%farming-2/site.webmanifest" />
    <title>Farming 2</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
